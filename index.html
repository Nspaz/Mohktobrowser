<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohktobrowser - Take a Mokh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .mokh-display {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            margin-bottom: 30px;
        }

        .mokh {
            font-size: 8em;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .mokh:hover {
            transform: scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .mokh.taken {
            animation: takeMokh 0.5s ease-out forwards;
        }

        @keyframes takeMokh {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5) rotate(360deg); }
            100% { transform: scale(0); opacity: 0; }
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
        }

        .stats {
            text-align: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-size: 1.2em;
            color: #666;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .mokh-collection {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .mokh-collection.hidden {
            display: none;
        }

        .mokh-collection h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 15px;
            justify-items: center;
        }

        .collection-item {
            font-size: 3em;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍪 Mohktobrowser</h1>
            <p class="subtitle">Take a mokh and enjoy!</p>
        </header>

        <main>
            <div class="mokh-display">
                <div class="mokh" id="currentMokh">🍪</div>
            </div>

            <div class="actions">
                <button id="takeMokhBtn" class="btn btn-primary">Take a Mokh</button>
                <button id="browseMokhsBtn" class="btn btn-secondary">Browse Mokhs</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Mokhs Taken:</span>
                    <span id="mokhCount" class="stat-value">0</span>
                </div>
            </div>

            <div id="mokhCollection" class="mokh-collection hidden">
                <h2>Your Mokh Collection</h2>
                <div id="collectionGrid" class="collection-grid"></div>
            </div>
        </main>

        <footer>
            <p>Made with ❤️ and mokhs</p>
        </footer>
    </div>

    <script>
        // Mokh types that can be collected
        var mokhTypes = ['🍪', '🥠', '🍩', '🧁', '🍰', '🎂', '🥧', '🍫', '🍬', '🍭'];

        // State
        var mokhCount = 0;
        var mokhCollection = [];
        var currentMokhIndex = 0;

        // DOM elements
        var currentMokhEl = document.getElementById('currentMokh');
        var mokhCountEl = document.getElementById('mokhCount');
        var takeMokhBtn = document.getElementById('takeMokhBtn');
        var browseMokhsBtn = document.getElementById('browseMokhsBtn');
        var mokhCollectionEl = document.getElementById('mokhCollection');
        var collectionGridEl = document.getElementById('collectionGrid');

        // Load saved state from localStorage
        function loadState() {
            try {
                var savedCount = localStorage.getItem('mokhCount');
                var savedCollection = localStorage.getItem('mokhCollection');
                if (savedCount) {
                    mokhCount = parseInt(savedCount, 10);
                    mokhCountEl.textContent = mokhCount;
                }
                if (savedCollection) {
                    mokhCollection = JSON.parse(savedCollection);
                    updateCollectionDisplay();
                }
            } catch (e) {
                // localStorage may be unavailable; continue with defaults
            }
        }

        // Save state to localStorage
        function saveState() {
            try {
                localStorage.setItem('mokhCount', mokhCount);
                localStorage.setItem('mokhCollection', JSON.stringify(mokhCollection));
            } catch (e) {
                // Silently ignore storage errors
            }
        }

        // Show next mokh
        function showNextMokh() {
            currentMokhIndex = (currentMokhIndex + 1) % mokhTypes.length;
            currentMokhEl.textContent = mokhTypes[currentMokhIndex];
        }

        // Take a mokh
        function takeMokh() {
            var mokh = currentMokhEl.textContent;

            currentMokhEl.classList.add('taken');

            mokhCount++;
            mokhCollection.push(mokh);
            mokhCountEl.textContent = mokhCount;

            saveState();

            if (!mokhCollectionEl.classList.contains('hidden')) {
                updateCollectionDisplay();
            }

            setTimeout(function() {
                currentMokhEl.classList.remove('taken');
                showNextMokh();
            }, 500);
        }

        // Toggle mokh collection display
        function toggleCollection() {
            mokhCollectionEl.classList.toggle('hidden');
            if (!mokhCollectionEl.classList.contains('hidden')) {
                updateCollectionDisplay();
                browseMokhsBtn.textContent = 'Hide Collection';
            } else {
                browseMokhsBtn.textContent = 'Browse Mokhs';
            }
        }

        // Update collection display
        function updateCollectionDisplay() {
            collectionGridEl.innerHTML = '';
            if (mokhCollection.length === 0) {
                var p = document.createElement('p');
                p.style.gridColumn = '1/-1';
                p.style.textAlign = 'center';
                p.style.color = '#999';
                p.textContent = 'No mokhs yet. Take some mokhs to start your collection!';
                collectionGridEl.appendChild(p);
                return;
            }
            for (var i = 0; i < mokhCollection.length; i++) {
                var mokhEl = document.createElement('div');
                mokhEl.className = 'collection-item';
                mokhEl.textContent = mokhCollection[i];
                mokhEl.title = 'Mokh #' + (i + 1);
                collectionGridEl.appendChild(mokhEl);
            }
        }

        // Event listeners
        takeMokhBtn.addEventListener('click', takeMokh);
        browseMokhsBtn.addEventListener('click', toggleCollection);
        currentMokhEl.addEventListener('click', takeMokh);

        // Initialize
        loadState();
        showNextMokh();
    </script>
</body>
</html>
